[build-system]
requires = ["flit_core >=4.1.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "aiohttp-remotes"
dynamic = ["version", "description"]
readme = "README.rst"
requires-python = ">=3.11"
authors = [{ name = "Andrew Svetlov", email = "andrew.svetlov@gmail.com" }]
dependencies = [
    "aiohttp >= 3.8.1",
    "typing-extensions >= 3.7.4",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
]

[project.urls]
Homepage = "https://github.com/aio-libs/aiohttp-remotes"
Documentation = "https://aiohttp-remotes.readthedocs.io"


[tool.towncrier]
package = "aiohttp_remotes"
filename = "CHANGES.rst"
directory = "CHANGES/"
title_format = "{version} ({project_date})"
issue_format = "`#{issue} <https://github.com/aio-libs/aiohttp-remotes/issues/{issue}>`_"
